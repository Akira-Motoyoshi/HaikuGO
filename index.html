  document.getElementById('delete-haiku-button').hidden =
    !user || h.userId !== user.id;
}

async function deleteCurrentHaiku() {
  const user = getCurrentUser();
  if (!currentHaiku || !user || currentHaiku.userId !== user.id) return;
  const confirmed = window.confirm('この俳句と、この句に付いた返句を削除しますか？');
  if (!confirmed) return;

  const haikuId = getHaikuId(currentHaiku);
  if (CLOUD_ENABLED) {
    const batch = cloudDb.batch();
    batch.delete(cloudDb.collection('haikus').doc(haikuId));
    const [replies, reactions] = await Promise.all([
      cloudDb.collection('replies').where('haikuId', '==', haikuId).get(),
      cloudDb.collection('haikuReactions').where('haikuId', '==', haikuId).get(),
    ]);
    replies.forEach(document => batch.delete(document.ref));
    reactions.forEach(document => batch.delete(document.ref));
    await batch.commit();
    closeCard();
    currentHaiku = null;
    return;
  }
  haikuMarkers.get(haikuId)?.remove();
  haikuMarkers.delete(haikuId);
  const index = haikuData.findIndex(haiku => getHaikuId(haiku) === haikuId);
  if (index >= 0) haikuData.splice(index, 1);
  delete replyStore[haikuId];
  okashiEvents = okashiEvents.filter(event => event.haikuId !== haikuId);

  if (!VERIFY_ONLY) {
    const pins = loadLocalPins().filter(haiku => getHaikuId(haiku) !== haikuId);
    const counts = readJson(OKASHI_STORAGE_KEY, {});
    const liked = readJson(OKASHI_LIKED_KEY, {});
    delete counts[haikuId];
    Object.keys(liked).forEach(key => {
      if (key === haikuId || key.endsWith(`:${haikuId}`)) delete liked[key];
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(pins));
    localStorage.setItem(REPLY_STORAGE_KEY, JSON.stringify(replyStore));
    localStorage.setItem(OKASHI_STORAGE_KEY, JSON.stringify(counts));
    localStorage.setItem(OKASHI_LIKED_KEY, JSON.stringify(liked));
    localStorage.setItem(OKASHI_EVENTS_KEY, JSON.stringify(okashiEvents));
  }

  closeCard();
  currentHaiku = null;
  renderRanking();
  renderProfilePanel();
}

async function handleIconUpload(event) {
  const input = event.currentTarget;
  const file = input.files?.[0];
  const message = document.getElementById('profile-message');
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    message.textContent = '画像ファイルを選んでください。';
    input.value = '';
    return;
  }
  if (file.size > 2 * 1024 * 1024) {
    message.textContent = '画像は2MB以下にしてください。';
    input.value = '';
    return;
  }

  try {
    pendingIconImage = await compressProfileImage(file);
    renderUserIcon(document.getElementById('profile-preview-icon'), {
      icon: getCurrentUser()?.icon || '🌿',
      iconImage: pendingIconImage,
    });
    message.textContent = '画像を選びました。プロフィールを保存してください。';
  } catch {
    message.textContent = '画像を読み込めませんでした。';
  }
}

function compressProfileImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.addEventListener('error', reject);
    reader.addEventListener('load', () => {
      const image = new Image();
      image.addEventListener('error', reject);
      image.addEventListener('load', () => {
        const size = 256;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const context = canvas.getContext('2d');
        const scale = Math.max(size / image.width, size / image.height);
        const width = image.width * scale;
        const height = image.height * scale;
        context.drawImage(image, (size - width) / 2, (size - height) / 2, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      });
      image.src = String(reader.result || '');
    });
    reader.readAsDataURL(file);
  });
}

function renderUserIcon(target, profile) {
  target.replaceChildren();
  if (profile?.iconImage) {
    const image = document.createElement('img');
    image.src = profile.iconImage;
    image.alt = '';
    target.append(image);
    return;
  }
  target.textContent = profile?.icon || '🌿';
}

function updateCardAuthor(h) {
  const profile = getAuthorProfile(h);
  document.getElementById('card-author').textContent = `— ${profile.displayName}`;
  renderUserIcon(document.getElementById('card-author-icon'), profile);
  const friendButton = document.getElementById('friend-button');
  const user = getCurrentUser();
  const isOwn = Boolean(user && profile.id === user.id);
  friendButton.hidden = isOwn || !user;
  friendButton.dataset.profileId = profile.id;
  const added = user ? getFriendIds(user.id).includes(profile.id) : false;
  friendButton.classList.toggle('added', added);
  friendButton.textContent = added ? '俳友です' : '俳友に追加';
}

function getAuthorProfile(h) {
  if (h.userId && usersStore[h.userId]) return usersStore[h.userId];
  const displayName = String(h.author || '作者不詳').replace(/^[-—]\s*/, '');
  const id = h.userId || `author:${simpleHash(displayName)}`;
  const icons = ['✒️', '🌙', '🌿', '🍁', '🐦'];
  return {
    id,
    displayName,
    icon: icons[parseInt(simpleHash(displayName), 36) % icons.length] || '✒️',
    bio: `${h.theme || '俳句'}を詠む俳人`,
  };
}

function getProfileById(profileId) {
  if (usersStore[profileId]) return usersStore[profileId];
  const haiku = haikuData.find(item => getAuthorProfile(item).id === profileId);
  if (haiku) return getAuthorProfile(haiku);
  const reply = Object.values(replyStore)
    .flatMap(replies => Array.isArray(replies) ? replies : [])
    .find(item => getAuthorProfile(item).id === profileId);
  return reply ? getAuthorProfile(reply) : null;
}

function simpleHash(text) {
  let hash = 0;
  for (const character of String(text)) {
    hash = (hash * 31 + character.codePointAt(0)) >>> 0;
  }
  return hash.toString(36);
}

function getFriendIds(userId) {
  return Array.isArray(friendsStore[userId]) ? friendsStore[userId] : [];
}

function toggleCurrentFriend() {
  const profileId = document.getElementById('friend-button').dataset.profileId;
  toggleFriendById(profileId);
}

function toggleFriendById(profileId) {
  const user = getCurrentUser();
  if (!user || !profileId || profileId === user.id) return false;
  const friendIds = getFriendIds(user.id);
  const index = friendIds.indexOf(profileId);
  if (index >= 0) friendIds.splice(index, 1);
  else friendIds.push(profileId);
  friendsStore[user.id] = friendIds;
  persistAccountState();
  renderProfilePanel();
  if (currentHaiku) updateCardAuthor(currentHaiku);
  return true;
}

function renderFriendList() {
  const user = getCurrentUser();
  const list = document.getElementById('friend-list');
  list.replaceChildren();
  if (!user) return;
  const profiles = getFriendIds(user.id).map(getProfileById).filter(Boolean);
  if (!profiles.length) {
    const empty = document.createElement('div');
    empty.className = 'friend-empty';
    empty.textContent = '俳句カードから作者を俳友に追加できます。';
    list.append(empty);
    return;
  }

  profiles.forEach(profile => {
    const item = document.createElement('div');
    item.className = 'friend-item';
    const icon = document.createElement('span');
    icon.className = 'user-icon';
    renderUserIcon(icon, profile);
    const info = document.createElement('div');
    info.className = 'friend-info';
    const name = document.createElement('div');
    name.className = 'friend-name';
    name.textContent = profile.displayName;
    const bio = document.createElement('div');
    bio.className = 'friend-bio';
    bio.textContent = profile.bio || 'まだbioはありません';
    info.append(name, bio);
    const remove = document.createElement('button');
    remove.className = 'friend-remove';
    remove.type = 'button';
    remove.textContent = '解除';
    remove.setAttribute('aria-label', `${profile.displayName}を俳友から解除`);
    remove.addEventListener('click', () => {
      friendsStore[user.id] = getFriendIds(user.id).filter(id => id !== profile.id);
      persistAccountState();
      renderProfilePanel();
      if (currentHaiku) updateCardAuthor(currentHaiku);
    });
    item.append(icon, info, remove);
    list.append(item);
  });
}

function getReceivedOkashi(userId) {
  const haikuCounts = getHaikuOkashiCounts();
  const haikuTotal = haikuData
    .filter(haiku => haiku.userId === userId)
    .reduce((sum, haiku) => sum + Number(haikuCounts[getHaikuId(haiku)] || 0), 0);
  const replyTotal = Object.values(replyStore)
    .flatMap(replies => Array.isArray(replies) ? replies : [])
    .filter(reply => reply.userId === userId)
    .reduce((sum, reply) => sum + Number(replyOkashiCounts[reply.id] || 0), 0);
  return haikuTotal + replyTotal;
}

function startCloudSync() {
  if (!CLOUD_ENABLED || cloudSyncStarted || !currentUserId) return;
  cloudSyncStarted = true;

  cloudUnsubscribers.push(
    cloudDb.collection('users').onSnapshot(snapshot => {
      snapshot.forEach(document => {
        usersStore[document.id] = {
          ...usersStore[document.id],
          id: document.id,
          ...document.data(),
        };
      });
      renderAccountUI();
      if (currentHaiku) updateCardAuthor(currentHaiku);
    }),
    cloudDb.collection('haikus').onSnapshot(snapshot => {
      cloudHaikuIds.forEach(id => {
        haikuMarkers.get(id)?.remove();
        haikuMarkers.delete(id);
        const index = haikuData.findIndex(haiku => getHaikuId(haiku) === id);
        if (index >= 0) haikuData.splice(index, 1);
      });
      cloudHaikuIds.clear();

      snapshot.forEach(document => {
        const h = deserializeCloudData({ id: document.id, ...document.data() });
        if (!h.name || !h.haiku || !Number.isFinite(h.lng) || !Number.isFinite(h.lat)) return;
        cloudHaikuIds.add(h.id);
        haikuData.push(h);
        addHaikuMarker(h);
      });
      renderRanking();
      renderProfilePanel();
    }),
    cloudDb.collection('replies').onSnapshot(snapshot => {
      replyStore = {};
      snapshot.forEach(document => {
        const reply = deserializeCloudData({ id: document.id, ...document.data() });
        if (!reply.haikuId) return;
        if (!replyStore[reply.haikuId]) replyStore[reply.haikuId] = [];
        replyStore[reply.haikuId].push(reply);
      });
      if (currentHaiku) updateReplyArea(currentHaiku);
    }),
    cloudDb.collection('haikuReactions').onSnapshot(snapshot => {
      okashiEvents = [];
      snapshot.forEach(document => {
        okashiEvents.push(deserializeCloudData({ id: document.id, ...document.data() }));
      });
      if (currentHaiku) updateOkashiButton(currentHaiku);
      renderRanking();
      renderProfilePanel();
    }),
    cloudDb.collection('replyReactions').onSnapshot(snapshot => {
      replyOkashiCounts = {};
      replyOkashiLiked = {};
      snapshot.forEach(document => {
        const reaction = deserializeCloudData({ id: document.id, ...document.data() });
        if (!reaction.replyId) return;
        replyOkashiCounts[reaction.replyId] = Number(replyOkashiCounts[reaction.replyId] || 0) + 1;
        replyOkashiLiked[`${reaction.userId}:${reaction.replyId}`] = true;
      });
      if (currentHaiku) renderReplies(getReplies(getHaikuId(currentHaiku)));
      renderProfilePanel();
    }),
    cloudDb.collection('friendships').doc(currentUserId).onSnapshot(document => {
      friendsStore[currentUserId] = document.exists && Array.isArray(document.data().friendIds)
        ? document.data().friendIds
        : [];
      renderFriendList();
      renderProfilePanel();
      if (currentHaiku) updateCardAuthor(currentHaiku);
    })
  );
}

function stopCloudSync() {
  cloudUnsubscribers.splice(0).forEach(unsubscribe => unsubscribe());
  cloudSyncStarted = false;
}

function deserializeCloudData(data) {
  const result = { ...data };
  Object.keys(result).forEach(key => {
    if (result[key]?.toDate) result[key] = result[key].toDate().toISOString();
  });
  return result;
}

function serializeHaiku(h) {
  return {
    id: h.id,
    name: h.name,
    lng: h.lng,
    lat: h.lat,
    haiku: h.haiku,
    author: h.author,
    theme: h.theme,
    category: h.category || 'nature',
    color: h.color,
    createdAt: h.createdAt,
    userId: h.userId,
  };
}

async function migrateLocalContentToCloud() {
  if (!CLOUD_ENABLED || !currentUserId || localStorage.getItem(`haiku_go_migrated_${currentUserId}`)) return;
  const pins = loadLocalPins();
  if (!pins.length) {
    localStorage.setItem(`haiku_go_migrated_${currentUserId}`, 'true');
    return;
  }
  const user = getCurrentUser();
  const batch = cloudDb.batch();
  pins.forEach(pin => {
    pin.id = pin.id || createHaikuId();
    pin.userId = currentUserId;
    pin.author = `— ${user.displayName}`;
    batch.set(cloudDb.collection('haikus').doc(pin.id), serializeHaiku(pin));
  });
  await batch.commit();
  localStorage.setItem(`haiku_go_migrated_${currentUserId}`, 'true');
}

function getHaikuId(h) {
  if (h.id) return h.id;
  return `seed:${h.name}:${h.author}:${h.haiku}`;
}

function createHaikuId() {
  if (window.crypto?.randomUUID) return window.crypto.randomUUID();
  return `local:${Date.now()}:${Math.random().toString(36).slice(2)}`;
}

function readJson(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key) || 'null');
    return value && typeof value === 'object' ? value : fallback;
  } catch {
    return fallback;
  }
}

function loadLocalPins() {
  try {
    const pins = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (!Array.isArray(pins)) return [];
    return pins.filter(h =>
      h &&
      typeof h.name === 'string' &&
      typeof h.haiku === 'string' &&
      Number.isFinite(h.lng) &&
      Number.isFinite(h.lat) &&
      PIN_COLORS.includes(h.color)
    );
  } catch {
    return [];
  }
}

function saveLocalPin(h) {
  const pins = loadLocalPins();
  pins.push(h);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(pins));
}
